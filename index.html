<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Noto+Sans+SC:wght@400;700&family=Syne+Mono&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lily Lan's Portfolio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Loading screen. Hidden automatically once the model finishes loading. -->
    <div id="loading-screen">
      <p id="loading-text"></p>
    </div>

    <!-- Language switch (English / 中文). Sits above every other layer so it
         stays reachable from the room, the laptop desktop and open windows. -->
    <button id="lang-toggle" type="button"></button>

    <!-- Simple overlay UI. Replace with your own sections later. -->
    <div id="ui-overlay">
      <h1 data-i18n="heading">Lily Lan's Space</h1>
      <p data-i18n="welcome">WELCOME, click on the laptop to explore more...</p>
    </div>

    <!-- This panel is just for development: it shows the name of whatever
         object your mouse is hovering, so you can find out what each part
         of your downloaded model is called. Delete it once you're done
         mapping names to sections. -->
    <!-- <div id="debug-panel">Hover an object to see its name</div> -->

    <!-- "Lily OS": the pretend laptop desktop shown when the laptop is
         clicked. Icons, dock and windows are built from src/content.js. -->
    <div id="os" class="hidden">
      <div id="os-boot" class="is-done" aria-hidden="true">
        <div class="os-boot-mark">
          <span class="os-logo"></span>
          <span class="os-boot-name">Lily OS</span>
        </div>
        <div class="os-boot-bar"><span></span></div>
        <p class="os-boot-text" data-i18n="bootText">Starting up...</p>
      </div>

      <header id="os-menubar">
        <div class="os-brand"><span class="os-logo"></span>Lily OS</div>
        <div class="os-menubar-right">
          <button id="os-lang" type="button"></button>
          <span id="os-clock"></span>
          <button id="os-power" type="button">
            <span class="os-power-icon" aria-hidden="true">&#x23FB;</span>
            <span data-i18n="powerOff">Back to room</span>
          </button>
        </div>
      </header>

      <main id="os-desktop">
        <div id="desktop-icons"></div>

        <aside id="os-note">
          <p class="os-note-title" data-i18n="noteTitle"></p>
          <p data-i18n="noteBody"></p>
          <p class="os-note-sign" data-i18n="noteSign"></p>
        </aside>

        <div id="os-windows"></div>
        <nav id="os-dock" aria-label="Dock"></nav>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
